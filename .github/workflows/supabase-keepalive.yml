name: Supabase Keep Alive

on:
  push : 
    branches:
      - main
  schedule:
    - cron: "59 * * * *"

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:

      - name: 🔍 Check API Key
        run: |
          if [ -z "${{ secrets.X_APIKEY_KEEPALIVE }}" ]; then
            echo "❌ GitHub Secret kosong atau tidak tersedia"
            exit 1
          else
            echo "✅ GitHub Secret tersedia"
          fi
       
      - name: 🚀 Wake the database up
        run: |
          curl -f -sS \
            -H "x-apikey-keepalive: ${{ secrets.X_APIKEY_KEEPALIVE }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"alive"}' \
            "https://velonexa-be.vercel.app/keepalive"

      - name: Ping Supabase
        run: |
          curl -f -sS \
            -H "x-apikey-keepalive: ${{ secrets.X_APIKEY_KEEPALIVE }}" \
            "https://velonexa-be.vercel.app/keepalive/1"

      - name: Done!
        run: |
          echo "================================"
          echo "🎉 Supabase Keep Alive finished!"
          echo "================================"
        
