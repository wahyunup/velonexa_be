name: Supabase Keep Alive

on:
  schedule:
    - cron: "59 * * * *"

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Wake the database up
        run: |
          echo "Waking up the database..."
          curl -sS \
            -H "x-apikey-keepalive: ${{ secrets.X_APIKEY_KEEPALIVE }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"alive"}' \
            "https://velonexa-be.vercel.app/keepalive"

          echo ""
          echo "🚀 Database is awake"
      - name: Ping Supabase
        run: |
          echo "Pinging Supabase to keep the database warm..."
          curl -sS \
            -H "x-apikey-keepalive: ${{ secrets.X_APIKEY_KEEPALIVE }}" \
            "https://velonexa-be.vercel.app/keepalive/1"
          echo ""
          echo "🚀 Supabase fly higher"

      - name: finish
        run: echo "Finish!"
